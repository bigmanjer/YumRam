name: tests

# Push/PR triggers are off while GitHub Actions is unavailable on this account (billing lock): every run
# failed before starting a single step, so each commit showed a red X although all tests pass locally.
# To turn automatic runs back on: add "push:" and "pull_request:" under "on:" again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-5_1:
    # YUMRAM targets Windows PowerShell 5.1 + WPF, which only exists on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion

      - name: Run all tests (each in its own Windows PowerShell 5.1 process)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tests\Run-AllTests.ps1

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-5_1:
    # YUMRAM targets Windows PowerShell 5.1 + WPF, which only exists on Windows.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: powershell
        run: $PSVersionTable.PSVersion

      - name: Run all tests (each in its own Windows PowerShell 5.1 process)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File Tests\Run-AllTests.ps1
